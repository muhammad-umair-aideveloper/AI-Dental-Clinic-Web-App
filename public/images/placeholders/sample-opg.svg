<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0A0F1D"/>
  <rect x="20" y="20" width="760" height="410" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Grid overlay -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="20" y="20" width="760" height="410" fill="url(#grid)" opacity="0.4"/>
  
  <!-- Clinical Scan Title & Calibration Markers -->
  <text x="40" y="55" fill="#4FB8A6" font-family="monospace" font-size="14" font-weight="bold">PANORAMIC DIGITAL OPG SCAN (FULL ARCH)</text>
  <text x="40" y="75" fill="#94A3B8" font-family="monospace" font-size="11">FOV: 16x10 cm • kVp: 74 • mA: 10 • Exposure: 14.2s • Resolution: 0.15mm</text>
  <text x="640" y="55" fill="#5B9BD5" font-family="monospace" font-size="12" font-weight="bold">PATIENT R [L] DENTAL</text>
  
  <!-- Mandibular Arch & Maxillary Contour (X-ray bone density gradient) -->
  <path d="M 120 220 Q 250 340 400 350 Q 550 340 680 220" fill="none" stroke="#E2E8F0" stroke-width="28" stroke-linecap="round" opacity="0.35"/>
  <path d="M 160 210 Q 270 310 400 320 Q 530 310 640 210" fill="none" stroke="#FFFFFF" stroke-width="14" opacity="0.5"/>
  
  <!-- Upper Arch -->
  <path d="M 130 180 Q 250 140 400 135 Q 550 140 670 180" fill="none" stroke="#E2E8F0" stroke-width="22" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Stylized Tooth Roots and Crowns -->
  <g fill="#F8FAFC" opacity="0.65">
    <!-- Lower Molars Left -->
    <rect x="200" y="240" width="22" height="40" rx="4"/>
    <rect x="230" y="250" width="20" height="38" rx="4"/>
    <rect x="260" y="260" width="18" height="36" rx="4"/>
    <rect x="285" y="270" width="16" height="34" rx="3"/>
    <!-- Lower Anterior -->
    <rect x="310" y="280" width="14" height="32" rx="3"/>
    <rect x="330" y="285" width="13" height="30" rx="3"/>
    <rect x="350" y="290" width="13" height="30" rx="3"/>
    <rect x="370" y="292" width="13" height="30" rx="3"/>
    <rect x="390" y="293" width="13" height="30" rx="3"/>
    <rect x="410" y="292" width="13" height="30" rx="3"/>
    <rect x="430" y="290" width="13" height="30" rx="3"/>
    <rect x="450" y="285" width="13" height="30" rx="3"/>
    <rect x="470" y="280" width="14" height="32" rx="3"/>
    <!-- Lower Molars Right -->
    <rect x="495" y="270" width="16" height="34" rx="3"/>
    <rect x="520" y="260" width="18" height="36" rx="4"/>
    <rect x="548" y="250" width="20" height="38" rx="4"/>
    <rect x="578" y="240" width="22" height="40" rx="4"/>
  </g>
  
  <!-- Implant Highlight Marker at #46 (Lower Right Molar) -->
  <rect x="546" y="252" width="24" height="48" rx="3" fill="#38BDF8" opacity="0.8" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="558" cy="276" r="30" fill="none" stroke="#4FB8A6" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="588" y1="276" x2="670" y2="310" stroke="#4FB8A6" stroke-width="1.5"/>
  <text x="675" y="315" fill="#4FB8A6" font-family="sans-serif" font-size="11" font-weight="bold">Planned Fixture Site #46 (11.5mm / Ø 4.3mm)</text>
  
  <!-- Radiopacity Scale Indicator -->
  <rect x="40" y="380" width="150" height="12" fill="url(#densityScale)" rx="2"/>
  <defs>
    <linearGradient id="densityScale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <text x="40" y="408" fill="#64748B" font-family="monospace" font-size="9">RADIOLUCENT &lt;-----------------&gt; RADIOPAQUE</text>
  <text x="640" y="408" fill="#64748B" font-family="monospace" font-size="9">LAHORE DENTAL DIGITAL PACS</text>
</svg>
